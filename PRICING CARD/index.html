<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="pricing-section">

        <header class="section-header">
            <span class="subtitle">SIMPLE & TRANSPARENT</span>

            <h1>Choose Your Perfect Plan</h1>

            <p>
                Flexible pricing plans designed to help you
                grow and achieve more.
            </p>
        </header>

        <form class="pricing-grid">

            <!-- BASIC PLAN -->
            <div class="plan-option">

                <input
                    type="radio"
                    name="pricing-plan"
                    id="basic"
                    class="plan-radio"
                >

                <label for="basic" class="pricing-card">

                    <div class="card-header">
                        <div class="plan-icon basic-icon">B</div>

                        <h2>Basic</h2>

                        <p class="description">
                            Perfect for getting started.
                        </p>
                    </div>

                    <div class="price-section">
                        <h3>
                            <span class="currency">$</span>9
                            <span class="period">/month</span>
                        </h3>

                        <p>Billed monthly</p>
                    </div>

                    <div class="features">
                        <h4>What's included</h4>

                        <ul>
                            <li><span>✓</span> 1 project</li>
                            <li><span>✓</span> Basic analytics</li>
                            <li><span>✓</span> 5 GB storage</li>
                            <li><span>✓</span> Email support</li>
                            <li class="disabled"><span>×</span> Advanced reports</li>
                            <li class="disabled"><span>×</span> Priority support</li>
                        </ul>
                    </div>

                    <div class="card-action">
                        <span class="select-button">Choose Basic</span>

                        <span class="selected-button">Selected ✓</span>

                        <p>No credit card required</p>
                    </div>

                </label>
            </div>


            <!-- PRO PLAN -->
            <div class="plan-option popular">

                <input
                    type="radio"
                    name="pricing-plan"
                    id="pro"
                    class="plan-radio"
                    checked
                >

                <label for="pro" class="pricing-card">

                    <span class="popular-badge">MOST POPULAR</span>

                    <div class="card-header">
                        <div class="plan-icon pro-icon">P</div>

                        <h2>Pro</h2>

                        <p class="description">
                            Perfect for growing businesses.
                        </p>
                    </div>

                    <div class="price-section">
                        <h3>
                            <span class="currency">$</span>29
                            <span class="period">/month</span>
                        </h3>

                        <p>Billed monthly</p>
                    </div>

                    <div class="features">
                        <h4>What's included</h4>

                        <ul>
                            <li><span>✓</span> 10 projects</li>
                            <li><span>✓</span> Advanced analytics</li>
                            <li><span>✓</span> 50 GB storage</li>
                            <li><span>✓</span> Priority email support</li>
                            <li><span>✓</span> Advanced reports</li>
                            <li class="disabled"><span>×</span> Dedicated account manager</li>
                        </ul>
                    </div>

                    <div class="card-action">
                        <span class="select-button">Choose Pro</span>

                        <span class="selected-button">Selected ✓</span>

                        <p>Cancel anytime</p>
                    </div>

                </label>
            </div>


            <!-- PREMIUM PLAN -->
            <div class="plan-option">

                <input
                    type="radio"
                    name="pricing-plan"
                    id="premium"
                    class="plan-radio"
                >

                <label for="premium" class="pricing-card">

                    <div class="card-header">
                        <div class="plan-icon premium-icon">P+</div>

                        <h2>Premium</h2>

                        <p class="description">
                            For professionals who need more.
                        </p>
                    </div>

                    <div class="price-section">
                        <h3>
                            <span class="currency">$</span>79
                            <span class="period">/month</span>
                        </h3>

                        <p>Billed monthly</p>
                    </div>

                    <div class="features">
                        <h4>What's included</h4>

                        <ul>
                            <li><span>✓</span> Unlimited projects</li>
                            <li><span>✓</span> Advanced analytics</li>
                            <li><span>✓</span> 500 GB storage</li>
                            <li><span>✓</span> 24/7 priority support</li>
                            <li><span>✓</span> Advanced reports</li>
                            <li><span>✓</span> Dedicated account manager</li>
                        </ul>
                    </div>

                    <div class="card-action">
                        <span class="select-button">Choose Premium</span>

                        <span class="selected-button">Selected ✓</span>

                        <p>Cancel anytime</p>
                    </div>

                </label>
            </div>

        </form>

        <footer class="pricing-footer">
            <p>All plans include secure access and regular updates.</p>
        </footer>

    </section>

</body>
</html>
